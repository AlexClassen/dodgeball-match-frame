name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Build macOS app
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_NOTARIZATION_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Apple signing secrets found — building signed and notarized release"
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            export CSC_LINK="$CERT_PATH"
            export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_NOTARIZATION_PASSWORD"
            npm run dist:mac -- \
              --config.mac.hardenedRuntime=true \
              --config.mac.notarize=true \
              --config.mac.gatekeeperAssess=false
          else
            echo "Apple signing secrets not configured — building unsigned release"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist:mac
          fi
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: Match Framer ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## macOS install

            **Signed release** (after Apple signing secrets are configured): open the `.dmg`, drag Match Framer to Applications, and launch normally.

            **Unsigned release** (current builds): macOS may show *"Match Framer is damaged"*. This is Gatekeeper blocking an unsigned download, not actual corruption. After copying the app to Applications, run:

            ```bash
            xattr -cr "/Applications/Match Framer.app"
            ```

            Then open the app from Applications, or right-click → **Open** the first time.
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
